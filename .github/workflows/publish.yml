name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish-core:
    name: Publish manas-fm
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Set version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version: $VERSION"
          cd packages/manas-fm
          npm pkg set version="$VERSION"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run tests
        run: pnpm --filter manas-fm test

      - name: Build package
        run: pnpm --filter manas-fm build

      - name: Publish to npm
        working-directory: ./packages/manas-fm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version update to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/manas-fm/package.json
          git commit -m "chore: bump version to ${GITHUB_REF_NAME#v}" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin HEAD:main

  check-cli-changes:
    name: Check CLI changes
    runs-on: ubuntu-latest
    outputs:
      cli_changed: ${{ steps.changes.outputs.cli_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous release tag
        id: prev_tag
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, treating CLI as changed"
            echo "prev_tag=" >> "$GITHUB_OUTPUT"
          else
            echo "Previous tag: $PREV_TAG"
            echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if CLI package changed
        id: changes
        run: |
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
          if [ -z "$PREV_TAG" ]; then
            echo "cli_changed=true" >> "$GITHUB_OUTPUT"
            echo "No previous tag — marking CLI as changed"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$PREV_TAG"..HEAD -- packages/cli/)
          if [ -n "$CHANGED" ]; then
            echo "cli_changed=true" >> "$GITHUB_OUTPUT"
            echo "CLI changes detected:"
            echo "$CHANGED"
          else
            echo "cli_changed=false" >> "$GITHUB_OUTPUT"
            echo "No CLI changes since $PREV_TAG"
          fi

  publish-cli:
    name: Publish CLI (add-manas-fm)
    runs-on: ubuntu-latest
    needs: [publish-core, check-cli-changes]
    if: needs.check-cli-changes.outputs.cli_changed == 'true'

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Set version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing CLI version: $VERSION"
          cd packages/cli
          npm pkg set version="$VERSION"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build CLI
        run: pnpm --filter add-manas-fm build

      - name: Publish to npm
        working-directory: ./packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version update to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/cli/package.json
          git commit -m "chore: bump CLI version to ${GITHUB_REF_NAME#v}" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin HEAD:main
